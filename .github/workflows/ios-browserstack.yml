name: Build iOS IPA for BrowserStack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_API_URL: https://api.lavlokshan.com/api/v1
      EXPO_PUBLIC_HUB_URL: https://api.lavlokshan.com/hubs/live
      EXPO_PUBLIC_MEDIA_URL: https://fileserverapi.lavlokshan.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build | tee ios-build.log
      - name: Package IPA
        run: |
          set -euo pipefail
          app=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/main.jsbundle"
          mkdir -p dist/ios/Payload
          ditto "$app" "dist/ios/Payload/$(basename "$app")"
          cd dist/ios
          /usr/bin/zip -qry LavLokshan-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LavLokshan-iOS-unsigned
          path: mobile/dist/ios/LavLokshan-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: mobile/ios-build.log
          if-no-files-found: ignore
